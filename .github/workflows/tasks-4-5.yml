name: Coursework Tasks 4 and 5

on:
  workflow_dispatch:
  push:
    paths:
      - "task4-neo4j/**"
      - "task5-literature-review.md"
      - "task5-validation/**"
      - ".dockerignore"
      - ".github/workflows/tasks-4-5.yml"
      - ".github/scripts/run_task4_neo4j_ci.sh"
      - ".github/scripts/validate_task4_evidence.py"
      - ".github/scripts/validate_task5_literature.py"
      - ".github/scripts/write_evidence_manifest.py"
  pull_request:
    paths:
      - "task4-neo4j/**"
      - "task5-literature-review.md"
      - "task5-validation/**"
      - ".dockerignore"
      - ".github/workflows/tasks-4-5.yml"
      - ".github/scripts/run_task4_neo4j_ci.sh"
      - ".github/scripts/validate_task4_evidence.py"
      - ".github/scripts/validate_task5_literature.py"
      - ".github/scripts/write_evidence_manifest.py"

permissions:
  contents: read

concurrency:
  group: tasks-4-5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-4-neo4j:
    name: Task 4 - Neo4j runtime evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: coursework-task4-${{ github.run_id }}-${{ github.run_attempt }}
      TASK4_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence/task4
      COURSEWORK_COMMIT_SHA: ${{ github.sha }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || format('task4-ci-{0}-{1}', github.run_id, github.run_attempt) }}

    steps:
      - name: Check out coursework
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Task 4 and capture evidence
        shell: bash
        run: bash .github/scripts/run_task4_neo4j_ci.sh

      - name: Always stop Task 4 containers
        if: always()
        shell: bash
        working-directory: task4-neo4j
        run: docker compose down --remove-orphans || true

      - name: Upload Task 4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-4-neo4j-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/task4
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  task-5-literature:
    name: Task 5 - literature and references
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: coursework-task5-${{ github.run_id }}-${{ github.run_attempt }}
      COURSEWORK_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Check out coursework
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Task 5 in Docker
        shell: bash
        run: >-
          docker compose --file task5-validation/docker-compose.yml
          run --rm --build literature-validation

      - name: Upload Task 5 validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-5-literature-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/task5
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Clean up Task 5 containers
        if: always()
        shell: bash
        run: >-
          docker compose --file task5-validation/docker-compose.yml
          down --remove-orphans || true
