name: Tasks 2 and 3 containerized verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "task2-kafka-flink/**"
      - "task3-spark/**"
      - ".dockerignore"
      - ".github/scripts/task3_capture_spark_ui.py"
      - ".github/scripts/validate_task3_outputs.py"
      - ".github/workflows/tasks-2-3.yml"
  pull_request:
    paths:
      - "task2-kafka-flink/**"
      - "task3-spark/**"
      - ".dockerignore"
      - ".github/scripts/task3_capture_spark_ui.py"
      - ".github/scripts/validate_task3_outputs.py"
      - ".github/workflows/tasks-2-3.yml"

permissions:
  contents: read

concurrency:
  group: tasks-2-3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-2-kafka-flink:
    name: Task 2 / Kafka and Flink
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: task2-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Check out coursework
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build, run, and verify Task 2 in Docker
        working-directory: task2-kafka-flink
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose run --build --rm flink-job-build
          docker compose up --build --detach --wait --wait-timeout 180 \
            kafka flink-jobmanager flink-taskmanager
          docker compose run --build --rm --no-deps flink-dashboard-runner
          docker compose up --build --detach --wait --wait-timeout 180 \
            traffic-producer
          docker compose run --rm --no-deps task2-evidence-verifier

      - name: Upload Task 2 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-2-kafka-flink-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            task2-kafka-flink/artifacts/traffic-window-job.jar
            task2-kafka-flink/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up Task 2 containers
        if: always()
        working-directory: task2-kafka-flink
        shell: bash
        run: docker compose down --volumes --remove-orphans || true

  task-3-spark:
    name: Task 3 / Spark standalone analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: task3-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COURSEWORK_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Check out coursework
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build, run, and verify Task 3 in Docker
        working-directory: task3-spark
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose build --pull evidence-verifier
          docker compose up --detach
          docker compose wait run-analysis
          docker compose run --rm --no-deps evidence-verifier

      - name: Upload Task 3 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-3-spark-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            task3-spark/output/
            task3-spark/metrics/
            task3-spark/events/
            task3-spark/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up Task 3 containers
        if: always()
        working-directory: task3-spark
        shell: bash
        run: docker compose down --volumes --remove-orphans || true
